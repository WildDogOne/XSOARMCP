[project]
name = "xsoar-mcp"
version = "0.2.0"
description = "MCP server for Cortex XSOAR, generated from Palo Alto's own OpenAPI/Swagger spec"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "httpx2",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    # Security floor: dnspython is transitive (fastmcp -> pydantic[email] ->
    # email-validator, which only requires dnspython>=2.0.0). Pin the patched
    # version so a fresh resolve that ignores uv.lock (e.g. `uv tool install .`)
    # can't reintroduce the pre-2.9.2 advisories.
    "dnspython>=2.9.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.scripts]
xsoar-mcp = "xsoar_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xsoar_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
