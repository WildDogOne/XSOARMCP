[project]
name = "xsoar-mcp"
version = "0.1.1"
description = "MCP server for Cortex XSOAR, generated from Palo Alto's own OpenAPI/Swagger spec"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "httpx2",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.scripts]
xsoar-mcp = "xsoar_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xsoar_mcp"]
